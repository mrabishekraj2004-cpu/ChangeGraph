x-changegraph-environment: &changegraph-environment
  NODE_ENV: production
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before starting the container}
  APP_URL: ${APP_URL:-http://localhost:3000}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
  EMAIL_FROM: ${EMAIL_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  CHANGEGRAPH_DB_PATH: /app/data/changegraph.db
  CHANGEGRAPH_TRUSTED_PROXY_HOPS: ${CHANGEGRAPH_TRUSTED_PROXY_HOPS:-0}
  CHANGEGRAPH_SEED_DEMO: ${CHANGEGRAPH_SEED_DEMO:-false}
  CHANGEGRAPH_INGEST_TOKEN: ${CHANGEGRAPH_INGEST_TOKEN:-}
  CHANGEGRAPH_INGEST_WORKSPACE_ID: ${CHANGEGRAPH_INGEST_WORKSPACE_ID:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_WORKSPACE_ID: ${GITHUB_WORKSPACE_ID:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  DATABASE_URL: ${DATABASE_URL:-}

services:
  changegraph:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment: *changegraph-environment
    volumes:
      - changegraph-data:/app/data
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    environment: *changegraph-environment
    healthcheck:
      disable: true
    volumes:
      - changegraph-data:/app/data
    depends_on:
      changegraph:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    profiles: ["postgres"]
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: ${CHANGEGRAPH_POSTGRES_DB:-changegraph}
      POSTGRES_USER: ${CHANGEGRAPH_POSTGRES_USER:-changegraph}
      POSTGRES_PASSWORD: ${CHANGEGRAPH_POSTGRES_PASSWORD:?Set CHANGEGRAPH_POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - "${CHANGEGRAPH_POSTGRES_PORT:-55432}:5432"
    volumes:
      - changegraph-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  changegraph-data:
  changegraph-postgres-data:
